<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>현재 GPS 좌표 확인</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      text-align: center;
      padding: 40px 20px;
    }
    button {
      font-size: 18px;
      padding: 14px 24px;
      border: none;
      border-radius: 12px;
      background: #007aff;
      color: white;
    }
    #result {
      margin-top: 25px;
      font-size: 17px;
      line-height: 1.8;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <h1>📍 현재 위치</h1>
  <button onclick="getLocation()">현재 GPS 좌표 확인</button>
  <div id="result">버튼을 눌러 위치를 확인하세요.</div>

  <script>
    function getLocation() {
      const result = document.getElementById("result");

      if (!navigator.geolocation) {
        result.innerHTML = "❌ 이 브라우저에서는 위치 기능을 사용할 수 없습니다.";
        return;
      }

      result.innerHTML = "📡 현재 위치를 확인하는 중...";

      navigator.geolocation.getCurrentPosition(
        function(position) {
          const latitude = position.coords.latitude;
          const longitude = position.coords.longitude;
          const accuracy = position.coords.accuracy;

          result.innerHTML =
            "✅ 위치 확인 성공<br><br>" +
            "위도: " + latitude + "°<br>" +
            "경도: " + longitude + "°<br>" +
            "정확도: 약 " + Math.round(accuracy) + "m";
        },
        function(error) {
          let message = "";

          switch (error.code) {
            case error.PERMISSION_DENIED:
              message = "위치 권한이 거부되었습니다.";
              break;
            case error.POSITION_UNAVAILABLE:
              message = "현재 위치를 확인할 수 없습니다.";
              break;
            case error.TIMEOUT:
              message = "위치 확인 시간이 초과되었습니다.";
              break;
            default:
              message = "알 수 없는 오류가 발생했습니다.";
          }

          result.innerHTML = "❌ " + message;
        },
        {
          enableHighAccuracy: true,
          timeout: 15000,
          maximumAge: 0
        }
      );
    }
  </script>
</body>
</html>
